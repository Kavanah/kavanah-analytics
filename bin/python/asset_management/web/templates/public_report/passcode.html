<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ title }}</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f0ece4; color: #1a2744;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .public-passcode { text-align: center; max-width: 420px; padding: 32px; }
  .public-passcode h1 { font-weight: 400; font-size: 22px; margin: 0 0 8px 0; }
  .public-passcode p { color: #5a6a80; margin: 0 0 20px 0; }
  .public-passcode form { display: flex; gap: 8px; justify-content: center; }
  .public-passcode input[type=password] {
    font: inherit; font-size: 15px; padding: 9px 12px; width: 220px;
    border: 1px solid #d5dbdb; border-radius: 6px; background: #fff;
  }
  .public-passcode button {
    font: inherit; font-size: 15px; padding: 9px 16px; border: 0; border-radius: 6px;
    background: #1a2744; color: #fff; cursor: pointer;
  }
  .public-passcode .error { color: #a23b2a; margin: 12px 0 0 0; font-size: 14px; }
</style>
</head>
<body>
<div class="public-passcode">
  <h1>{{ title }}</h1>
  <p>This report is protected. Enter the passcode from the person who shared it with you.</p>
  {# the form posts to the unlock route for this token; the token
     itself never appears in the page body, only in the action URL. #}
  <form method="post" action="/public/report/{{ token }}/unlock">
    <input type="password" name="passcode" autocomplete="off" autofocus required
           maxlength="64" aria-label="Passcode" placeholder="Passcode">
    <button type="submit">View report</button>
  </form>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
</div>
</body>
</html>
