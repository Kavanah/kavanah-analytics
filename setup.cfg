[flake8]
max-line-length = 127
# E203: whitespace before ':' — conflicts with Black
# W503/W504: line break before/after binary operator — style preference
# E402: module import not at top — pervasive sys.path pattern, suppressed for baseline
# E501: line too long — Black handles formatting; long strings/URLs are exempt
# F541: f-string without placeholders — cosmetic, low priority
# F401: unused imports — pervasive in existing codebase, suppressed for baseline
# F841: local variable assigned but never used — suppressed for baseline
# E401: multiple imports on one line — suppressed for baseline
# E722: bare except — pervasive in one-off migration/template scripts, suppressed for baseline
extend-ignore = E203,W503,W504,E402,E501,F541,F401,F841,E401,E722
exclude =
    .git,
    __pycache__,
    *.egg-info,
    bin/python/asset_management/web/static/
    # One-off migration scripts — not actively maintained (one-off debug
    # diagnostics moved to the private internal/tools/debug/)
    bin/python/import_scripts/migration/
    bin/python/migration/
    # Scratch/work-in-progress copies — not canonical files
    bin/python/asset_management/web/app-John_Alienware.py
    bin/python/asset_management/web/auth-John_Alienware.py
    bin/python/asset_management/web/blueprints/dashboard_builder/routes-John_Alienware.py
    bin/python/asset_management/web/blueprints/dashboard_builder/routes-John_Alienware-2.py
    bin/python/asset_management/web/blueprints/dashboard_builder/routes-John_Alienware-3.py
    bin/python/asset_management/web/services/echarts_transformer-John_Alienware.py
    bin/python/asset_management/web/services/es_query_builder-John_Alienware.py
per-file-ignores =
    # __init__.py files intentionally re-export names
    */__init__.py:F403,F405,F811
    # Star import pattern is intentional in this module
    bin/python/import_scripts/facebook/get_insights.py:F403,F405
    # Conditional re-imports for lazy loading pattern
    bin/python/import_scripts/facebook/lib/assets.py:F811
    # global declaration present for future use / thread safety guard
    bin/python/asset_management/web/services/role_filter_service.py:F824
    # dest_count undefined — known bug in migration scripts, tracked separately
    bin/python/import_scripts/migration/migrate_ig_to_unified.py:F821
    bin/python/import_scripts/migration/migrate_ig_to_unified-John_Alienware.py:F821
