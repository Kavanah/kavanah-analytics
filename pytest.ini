[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default: skip e2e tests (they require Playwright + a running server,
# install with `pip install -r requirements-e2e.txt && playwright install
# chromium`, then run with `pytest -m e2e`). The pre-push gate stays fast.
#
# --import-mode=importlib avoids module-basename collisions across PR-N/
# directories (e.g. the release-plan tests vs
# the release-plan tests). The legacy "prepend"
# mode requires unique basenames across the whole tree; importlib
# resolves each test file as a standalone module under its full path.
addopts = -m "not e2e" --import-mode=importlib
markers =
    unit: fast tests with all external dependencies mocked
    integration: tests that require a live Elasticsearch instance
    live: tests that hit a live deployed environment (staging/prod); require TEST_BASE_URL + TEST_SESSION_COOKIE env vars
    e2e: browser-driven end-to-end tests via Playwright; opt-in (excluded by default). Need a live Flask server + chromium.
    test_id(id): stable machine-readable identity matching the release-plan CSV (e.g. SEC-CSP-001). Exactly one per test.
    release_plan(name): release plan a test belongs to (e.g. ). Repeatable; a test can belong to multiple plans.
    release_plan_smoke: subset of a release plan that runs on every dev push (Critical-priority CSV rows).  / Story 5.

[coverage:run]
source =
    bin/python/asset_management/web
    bin/python/import_scripts
omit =
    */migration/*
    */test_*.py
    */__pycache__/*
    *-John_Alienware*.py
    *-John_Alienware-*.py

[coverage:report]
fail_under = 80
show_missing = true
