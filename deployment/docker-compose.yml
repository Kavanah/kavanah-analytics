# =============================================================================
# DEAM stack — single source of truth for container lifecycle
# =============================================================================
# This file is the canonical declaration of the four containers that make up
# the DEAM application stack:
#
#   es01                  — Elasticsearch 9.3.x
#   kib01                 — Kibana 9.3.x
#   imports_container     — Flask app stack (FB OAuth + Asset Manager + PW reset)
#   nginx-reverse-proxy   — OpenResty TLS terminator + router
#
# Why this file lives in git (and not as a step3 byproduct anymore):
#   Pre-2026-05-09, deployment/step3-app-stack.sh emitted docker-compose.yml
#   into $REPO_DIR/config/ on every run, which silently dropped any service or
# bind-mount additions made out-of-band. The compose file was
#   therefore unreliable as a runtime source of truth, and the actual stack
#   was managed by `docker run` invocations spread across step3, step6, and
# wrapper scripts. + the 2026-05-08 prod outage convinced
#   us to commit to compose as the single lifecycle owner. See
#   DECISIONS.md (2026-05-09 entry) for the full reasoning.
#
# How to use:
#   1. Run deployment/step3-app-stack.sh ONCE per host. It bootstraps yq,
#      vm.max_map_count, master-config.yaml, the elastic-network bridge, the
#      ES first-boot certs (via a one-shot docker run, then docker cp out to
#      the host), and writes deployment/.env with the substituted values.
#   2. Run deployment/02_deploy_stack.sh whenever you want to (re)deploy.
#      It does `docker compose -f deployment/docker-compose.yml up -d`,
#      polls health, then runs post-deploy migrations.
#   3. nginx is build-locally; deployment/step6-nginx-setup.sh builds the
#      `nginx-reverse-proxy:local` image. Compose only references it.
#
# Environment variables:
#   All ${VAR} substitutions resolve from deployment/.env (step3-managed) or
#   the operator's shell env. .env is gitignored. Variable names map 1:1 to
#   master-config.yaml fields where possible — see step3 for the wiring.
# =============================================================================

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Elasticsearch
  # ───────────────────────────────────────────────────────────────────────────
  # First-boot bootstrap (auto-config of TLS + security) is performed by
  # step3-app-stack.sh on initial host setup; the auto-generated certs,
  # elasticsearch.yml, and keystore are persisted to ${ELK_DIR}/es01/config/
  # so subsequent compose-managed launches can mount them back in. ES does
  # NOT re-run auto-config when those files are present, which is exactly
  # what we want — the persisted security state survives container recreations.
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: es01
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ES_ADMIN_PASS}
      - path.repo=/usr/share/elasticsearch/snapshots
      # pin the JVM heap instead of letting it auto-size to
      # 50 % of host RAM (3.9 GB on the 8 GB boxes, 8.8 GiB after prod moved to
      # 16 GB on 2026-10-17) while using 0.6–1.8 GB. Heap used has never passed
      # 1.8 GB; Elastic's "3,000 indices per GB of heap" master rule is met to
      # 6,000 indices at 2 GB. Override per box in .env: prod = -Xms4g -Xmx4g.
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      # Keep the heap out of swap (≈1 GB of the JVM was swapped on prod with
      # swappiness 60). Needs the memlock ulimit below.
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Heap + off-heap (Lucene page cache, direct buffers). Per box in .env:
    # prod = 8g on the 16 GB box; the default fits dev's 8 GB.
    mem_limit: ${ES_MEM_LIMIT:-4g}
    # loopback-bound like kib01. Docker's DNAT runs before UFW, so an
    # all-interfaces publish is reachable from anywhere the cloud firewall
    # allows. Everything in this repo reaches ES over the Docker network
    # (es01:9200 — nginx's /elasticsearch/ route included) or from the host
    # itself (localhost:9200). The km-infra SIEM ELK-access monitor, the last
    # outside caller of :9200, moved to the nginx /elasticsearch/ route behind
    # an es-allow/ entry on 2026-10-14.
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ${ELK_DIR}/es01/data:/usr/share/elasticsearch/data
      # Mount the ENTIRE config/ directory, not individual files. ES rewrites
      # elasticsearch.keystore atomically on every boot (rename .tmp into
      # place), and Linux refuses to do that if the target is a single-file
      # bind mount — fails with "Device or resource busy". Mounting the
      # parent dir lets the rename happen normally inside the bind mount.
      # Host dir must contain certs/, elasticsearch.yml, and the keystore
      # (step3's first-boot bootstrap populates these via docker cp from
      # the auto-config'd container). See DECISIONS.md 2026-05-09 entry.
      - ${ELK_DIR}/es01/config:/usr/share/elasticsearch/config
      - ${SNAPSHOT_DIR}:/usr/share/elasticsearch/snapshots
    restart: unless-stopped
    healthcheck:
      # Auth via -u; -k tolerates the self-signed cert from auto-config.
      # green/yellow are both healthy for single-node; red blocks downstream.
      test: ["CMD-SHELL", "curl -sk -u elastic:${ES_ADMIN_PASS} https://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      elastic-network:
        ipv4_address: 172.18.0.2

  # ───────────────────────────────────────────────────────────────────────────
  # Kibana
  # ───────────────────────────────────────────────────────────────────────────
  # kibana.yml is generated by step3 alongside .env. server.basePath, the
  # xpack encryption keys, and the ssl config live there as literals — that's
  # the documented, well-tested Kibana config surface.
  # EXCEPTION: the elasticsearch
  # password is the ONE value referenced as ${KIBANA_SYS_PASS} so it is NOT a
  # plaintext literal in kibana.yml. Kibana expands ${VAR} from the container
  # env at startup, so KIBANA_SYS_PASS must be passed in here (from .env, which
  # the SSM source-helper / step3 populate). Only this one key moved to a var —
  # the rest stay literal, keeping the "env-driven config is brittle" surface
  # to a single well-supported setting.
  kib01:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    container_name: kib01
    mem_limit: ${KIB_MEM_LIMIT}
    environment:
      # Substituted into kibana.yml's elasticsearch.password.
      - KIBANA_SYS_PASS=${KIBANA_SYS_PASS}
    depends_on:
      es01:
        condition: service_healthy
    # loopback-bound. Docker's port publish
    # bypasses UFW, so "5601:5601" exposed Kibana on every host interface.
    # Browsers reach Kibana through nginx (/kibana → kib01:5601 over the
    # Docker network); the host publish exists only for on-host checks
    # (05_health_check.sh, create-data-views.sh, kibana-import.sh curl
    # localhost:5601). From elsewhere: ssh -L 5601:localhost:5601.
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ${REPO_DIR}/kibana.yml:/usr/share/kibana/config/kibana.yml
      - ${ELK_DIR}/es01/config/certs/http_ca.crt:/usr/share/kibana/config/certs/http_ca.crt
    restart: unless-stopped
    healthcheck:
      # Kibana's /api/status reports level=available when fully ready.
      # `level=degraded` is treated as unhealthy on purpose — it usually
      # means ES is reachable but plugins haven't all initialized yet,
      # and we don't want nginx to start routing traffic to a degraded UI.
      #
      # IMPORTANT: kibana.yml sets server.basePath: /kibana with
      # server.rewriteBasePath: true. That means /api/status returns 404
      # and /kibana/api/status returns 200 — even from inside the container.
      # Don't drop the basePath here or the healthcheck will always fail.
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/kibana/api/status | grep '\"level\":\"available\"' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      elastic-network:
        ipv4_address: 172.18.0.3

  # ───────────────────────────────────────────────────────────────────────────
  # Flask DEAM app stack (FB OAuth + Asset Manager + Password Reset)
  # ───────────────────────────────────────────────────────────────────────────
  # Image is built locally; the Dockerfile lives at bin/python/Dockerfile and
  # step3 builds it on first install. Every later deploy rebuilds it too:
  # deployment/start-imports-container.sh and start-secrets-container.sh run
  # `docker compose build imports_container` before `up -d --force-recreate`
  # (before that, nothing in the flow ever rebuilt, and prod ran a
  # 2026-08-04 image under 2026-09 code). The `build:` block below is what
  # they build from; `up` alone still reuses the existing tag.
  imports_container:
    build:
      context: ${REPO_DIR}/bin/python
      dockerfile: Dockerfile
    image: ${DEAM_IMAGE:-de-imports:latest}
    container_name: imports_container
    mem_limit: ${FLASK_MEM_LIMIT}
    depends_on:
      es01:
        condition: service_healthy
    # loopback-bound, NOT published on all host
    # interfaces. nginx reaches these apps over the Docker network
    # (proxy_pass http://imports_container:808x), so the host publish exists
    # only for on-host health checks (05_health_check.sh curls localhost).
    # An all-interfaces publish let anyone reach gunicorn directly, bypassing
    # nginx — the exact precondition the X-Remote-User header trust relied on.
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:8085:8085"
    volumes:
      # Read-write: app data + reporting configs (master-config.yaml lives here;
      # the Restore page's config restore writes it, so it stays writable).
      - ${IMPORT_DATA_DIR}:/app/data
      - ${CONFIG_DIR}:/app/reporting_configs
      # Read-only: Python source is bind-mounted so a `git pull` +
      # container bounce is enough to ship code; no rebuild required for
      # source-only changes. start_web_apps.sh runs from this mount. Read-only so
      # a file-write bug in an importer cannot rewrite app code.
      - ${REPO_DIR}/bin/python:/app/python:ro
      # Read-write: uploaded workspace logos are the one runtime write
      # under the source tree; they live in the data dir, mounted over the
      # static path the app serves them from.
      - ${IMPORT_DATA_DIR}/uploads:/app/python/asset_management/web/static/uploads
      # Read-write: the password-reset app keeps its settings, live
      # reset tokens, rate limits and audit log in password_reset/config/.
      - ${IMPORT_DATA_DIR}/password_reset_config:/app/python/password_reset/config
      # Read-only: tests, deployment scripts, internal docs. The in-app
      # pytest runner reads from these.
      - ${REPO_DIR}/tests:/app/tests:ro
      - ${REPO_DIR}/pytest.ini:/app/pytest.ini:ro
      - ${REPO_DIR}/deployment:/app/deployment:ro
      - ${REPO_DIR}/.github:/app/.github:ro
      - ${REPO_DIR}/internal:/app/internal:ro
      # Read-only: AWS credentials file (host ~/.aws) so the NLQ / Ask Kavanah
      # Bedrock path can resolve the [bedrock] profile. This mount existed in the
      # pre- `docker run` invocation but was dropped when the stack moved to
      # compose (2026-05-09), silently breaking Data Explorer on Bedrock. The
      # [bedrock] profile lives on the host at /home/ubuntu/.aws/credentials.
      # NOTE: literal path, not ${HOME} — compose does not inherit the operator's
      # shell $HOME during interpolation, and the compose env file does not set it.
      # Both staging and prod run as the `ubuntu` user (/home/ubuntu/...).
      # the container runs as `app` (HOME=/home/app), not root.
      - /home/ubuntu/.aws:/home/app/.aws:ro
    environment:
      - ENC_KEY=${ENC_KEY}
      # retiring Fernet key(s), comma-separated, present only during
      # a key rotation window (SSM /km/<env>/deam/enc-key-previous → .env via
      # start-secrets-container.sh). lib/encryption.py decrypts with ENC_KEY
      # then each of these; encrypt always uses ENC_KEY. Blank = no rotation
      # in progress, which is the steady state.
      - ENC_KEY_PREVIOUS=${ENC_KEY_PREVIOUS:-}
      - ES01_INTERNAL_IP=172.18.0.2
      - ES01_PASSWORD=${ES_ADMIN_PASS}
      # ES Security-API write client (user/role create, update,
      # delete) authenticates with this API key (de_es_admin, manage_security).
      # Blank = every Security write keeps using the shared client above, which
      # is byte-identical to earlier behaviour. Filled from SSM
      # /km/<env>/elasticsearch/de-es-admin-api-key by start-secrets-container.sh
      # once seeds it. Reads stay on the shared client either way.
      - ES_ADMIN_API_KEY=${ES_ADMIN_API_KEY:-}
      # NOTE: FLASK_ENV / FLASK_DEBUG / DEAM_ENV deliberately absent.
      # No app code branches on them; setting them here would re-enable the
      # Werkzeug debugger and dev cookie defaults on prod.
      - KIBANA_URL=http://kib01:5601/kibana
      - SECRET_KEY=${FLASK_SECRET_KEY}
      - SESSION_LIFETIME=3600
      - SESSION_MAX_LIFETIME=86400
      # transparent dedup-field routing (Ad Sets reach from the window
      # index, additive from daily, stitched). Default EMPTY = OFF everywhere; set
      # DEDUP_ROUTING_ENABLED=true in a host's .env to turn it on. Staging .env
      # enables it for verification; prod stays off until the scale check passes.
      - DEDUP_ROUTING_ENABLED=${DEDUP_ROUTING_ENABLED:-}
      # X-Test-Persona header-auth path for ProofShot verification.
      # Default EMPTY = OFF everywhere (path inert). Set TEST_AUTH_SECRET=<random>
      # in the STAGING host env-file only, so a verification agent can authenticate
      # as a documented attack-surface persona without login/MFA/cookie. Prod MUST
      # NEVER set it — an absent secret means the path accepts nothing (safe by
      # absence, not by an env-name guess, per the rule). Same pattern as
      # DEDUP_ROUTING_ENABLED above.
      - TEST_AUTH_SECRET=${TEST_AUTH_SECRET:-}
      # domain of the persona usernames (test-<slug>@<domain>); blank =
      # the neutral default in lib/test_personas.py. Set on the host that seeded them.
      - TEST_PERSONA_DOMAIN=${TEST_PERSONA_DOMAIN:-}
      # extra hostnames the refuse-prod guards (lib/prod_hosts.py: seed
      # tools, import_load_service, tests/security conftest) treat as production,
      # comma-separated. Blank = the built-in product domain only. Without this line
      # a deployment/.env value never reached the container (review).
      - PROD_HOSTNAMES=${PROD_HOSTNAMES:-}
      # public hostname of this deployment, used to print full
      # refresh URLs in scripts/check_oauth_tokens.py (blank = relative paths)
      # and,, as the prod marker for the TEST_AUTH_SECRET
      # startup gate. Falls back to SERVER_NAME (nested interpolation) so a
      # compose.env written before prod's is — still identifies the
      # host after the next container recreate.
      - APP_PUBLIC_HOSTNAME=${APP_PUBLIC_HOSTNAME:-${SERVER_NAME:-}}
      # explicit deploy marker (dev|staging|test|prod). Read ONLY by the
      # refuse-only startup gate in web/secret_validation.py: a prod marker with
      # TEST_AUTH_SECRET set fails startup. Blank never enables anything.
      - DEPLOY_ENV=${DEPLOY_ENV:-}
      # the cold self-signup switch. Read by
      # web/config.py SELF_SIGNUP_ENABLED from env ONLY (master-config never
      # carried it). Blank/absent = false = uninvited visitors cannot create
      # accounts; invite links still work. Set true in deployment/.env to
      # reopen signup, then recreate.
      - SELF_SIGNUP_ENABLED=${SELF_SIGNUP_ENABLED:-}
      # secret salt for the demo-clone pseudonyms (demo_clone/transform.py).
      # SSM /km/<env>/deam/demo-clone-salt → .env via start-secrets-container.sh.
      # Blank = the 07:35 clone cron REFUSES to run (no default, by design);
      # rotating it requires a --full --recreate clone.
      - DEMO_CLONE_SALT=${DEMO_CLONE_SALT:-}
      # Kibana gate API-key bridge (skip Kibana's native login for
      # DEAM superusers already through the /kibana auth_request gate). The
      # gate authenticates to ES as the de_kibana_gate service account (cluster
      # grant_api_key + explicit run_as list, provisioned by km-infra) and mints
      # a per-user key via run_as. BOTH EMPTY = OFF everywhere: the gate answers
      # a bare 204 and Kibana shows its own login exactly as before (safe by
      # absence). Values land in deployment/.env from SSM via
      # start-secrets-container.sh (elasticsearch/de-kibana-gate-user|-password).
      # KIBANA_GATE_KEY_TTL (seconds, default 28800 = 8h, clamped 300..86400)
      # is the minted key's hard expiration — the backstop if a logout never
      # revokes.
      - KIBANA_GATE_USER=${KIBANA_GATE_USER:-}
      - KIBANA_GATE_PASSWORD=${KIBANA_GATE_PASSWORD:-}
      - KIBANA_GATE_KEY_TTL=${KIBANA_GATE_KEY_TTL:-}
      # USE_NEW_PERMISSIONS + USE_NEW_PERMISSIONS_SHADOW retired
      # (2026-05-28). The new-authz read path is unconditional; nothing in
      # imports_container reads either variable any more.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Phase 2 — config secrets the app reads env-first (config.py) but
      # which compose did not previously inject (so the app fell back to the YAML
      # value). Substituted from deployment/.env: empty `:-` defaults on dev (the
      # app then reads master-config as before), real values on hosts where
      # deployment/start-secrets-container.sh has written them into .env from SSM.
      # Adding them here is what lets Phase 3 strip these values from
      # master-config.yaml. They sit in `environment:` (not env_file:) on purpose
      # — compose's `environment:` overrides `env_file:`, so the SSM-sourced .env
      # value must win via the same ${VAR} substitution the other secrets use.
      - YUBICO_SECRET_KEY=${YUBICO_SECRET_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # SSO client secrets — SSM-sourced via
      # start-secrets-container.sh, env-first in config.py.
      - MICROSOFT_SSO_CLIENT_SECRET=${MICROSOFT_SSO_CLIENT_SECRET:-}
      - GOOGLE_SSO_CLIENT_SECRET=${GOOGLE_SSO_CLIENT_SECRET:-}
      # Google connector secrets — env-var-first loader with
      # on-disk fallback; empty until the SSM params exist and the secrets
      # wrapper runs, so this is inert on hosts that haven't cut over.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      # TikTok for Business app credentials — SSM-sourced via
      # start-secrets-container.sh. Sandbox values on dev only; empty on prod
      # until the production app is approved.
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      # hCaptcha keys for the signup forms; SSM-sourced via
      # start-secrets-container.sh (deam/hcaptcha-site-key|-secret-key),
      # env-first in config.py. Both empty = captcha skipped (as before).
      - HCAPTCHA_SITE_KEY=${HCAPTCHA_SITE_KEY:-}
      - HCAPTCHA_SECRET_KEY=${HCAPTCHA_SECRET_KEY:-}
      # the TikTok connector switch (lib/tiktok_constants.tiktok_enabled).
      # Blank/absent = OFF: no tile, no wizard/OAuth routes, no TikTok data view in
      # the pickers, no job-health expectation. Set true in deployment/.env, then
      # run start-imports-container.sh (it also re-provisions the cron line).
      - TIKTOK_ENABLED=${TIKTOK_ENABLED:-}
      # global import queue (lib/import_slots.py). IMPORT_GLOBAL_CAP =
      # max importer processes running at once; blank/0 = OFF (no cap, no queue —
      # the rollback). ~4 is safe per 2 vCPU, so 8 on the 4 vCPU prod box.
      # Runs over the cap wait FIFO ("queued (#N)") up to
      # IMPORT_QUEUE_MAX_WAIT_SECONDS (blank = 43200, 12 h), re-checking every
      # IMPORT_QUEUE_POLL_SECONDS (blank = 5). Recreate imports_container to apply.
      - IMPORT_GLOBAL_CAP=${IMPORT_GLOBAL_CAP:-}
      - IMPORT_QUEUE_MAX_WAIT_SECONDS=${IMPORT_QUEUE_MAX_WAIT_SECONDS:-}
      - IMPORT_QUEUE_POLL_SECONDS=${IMPORT_QUEUE_POLL_SECONDS:-}
      # AWS credentials for the Restore-from-Backup feature (prod only).
      # On prod, .env.aws is written by start-imports-container.sh on each
      # bounce after fetching from SSM. On dev/staging it's empty (created
      # by step3 with a placeholder comment). Always-present pattern avoids
      # the compose-v2.24-only `required: false` syntax — works on every
      # compose version that supports `env_file:` at all.
      - AWS_REGION=${AWS_REGION:-us-west-2}
    env_file:
      - .env.aws
    command: /app/python/start_web_apps.sh
    restart: unless-stopped
    healthcheck:
      # Asset Manager :8084 is the user-facing endpoint and the canonical
      # liveness signal. If gunicorn :8084 isn't accepting connections,
      # the container is unhealthy regardless of what :8083 / :8085 say.
      #
      # python3 instead of curl: the python:3.13-slim base image used by
      # bin/python/Dockerfile doesn't ship curl (or wget), but always has
      # python3. urllib.request.urlopen returns a status code we can check.
      # Exit 0 on 2xx/3xx, exit 1 otherwise.
      test:
        - "CMD-SHELL"
        # probe /login, not /. "/" requires auth, so every 15s probe
        # logged "WARNING Missing authentication from 127.0.0.1" — 11,941 of them
        # in two days (5,760/day, forever), 11.3% of the whole error log. A
        # warning that fires 6,000x/day trains everyone to ignore warnings.
        # /login is unauthenticated and renders through the same Flask+template
        # stack, so the health signal is unchanged: "/" only ever 302'd here
        # anyway. A richer /healthz that also probes ES is a future option.
        - "python3 -c 'import urllib.request,sys; r=urllib.request.urlopen(\"http://localhost:8084/login\",timeout=5); sys.exit(0 if 200<=r.status<400 else 1)'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      elastic-network:
        ipv4_address: 172.18.0.4

  # ───────────────────────────────────────────────────────────────────────────
  # nginx reverse proxy (OpenResty + Let's Encrypt SSL)
  # ───────────────────────────────────────────────────────────────────────────
  # Image is build-locally by step6-nginx-setup.sh, which also writes the
  # rendered nginx.conf, conf.d/default.conf, and .htpasswd into ${NGINX_DIR}.
  # Compose only manages lifecycle — building is step6's job.
  #
  # depends_on Kibana + imports_container so nginx doesn't start routing
  # until upstreams are ready. Nginx itself doesn't have a clean liveness
  # endpoint, so we rely on TCP/HTTP probes via /health (defined in nginx
  # template) for its own healthcheck.
  nginx-reverse-proxy:
    image: nginx-reverse-proxy:local
    container_name: nginx-reverse-proxy
    mem_limit: 256m
    # the entrypoint re-renders default.conf via
    # `envsubst '${SERVER_NAME} ${FB_SERVER_NAME} ${ES_HOST}'` on every start.
    # Pass those vars (sourced from deployment/.env, written by step3) so a
    # `compose up -d --force-recreate nginx-reverse-proxy` re-renders with real
    # hostnames instead of blanking server_name and downing the site.
    #
    # CAUTION (2026-08-25, KAM launch): the entrypoint renders from the
    # template BAKED INTO THE IMAGE at build time (Dockerfile COPYs it),
    # not from the bind-mounted ${NGINX_DIR}/conf.d copy. A template
    # change therefore needs an image rebuild BEFORE the force-recreate:
    #   cp deployment/nginx/conf.d/default.conf.template \
    #      ${NGINX_DIR}/conf.d/default.conf.template
    #   docker build -t nginx-reverse-proxy:local ${NGINX_DIR}
    #   docker compose -f deployment/docker-compose.yml up -d \
    #      --force-recreate nginx-reverse-proxy
    # the template now includes ${NGINX_DIR}/conf.d/es-allow/*.conf for
    # the /elasticsearch/ allow-list. Make sure that directory holds the caller
    # files (re-run step6, or copy internal/deployment/nginx/es-allow/*.conf by
    # hand) BEFORE the rebuild — an empty directory is legal nginx and means
    # `deny all` for every ES caller.
    # --force-recreate alone only re-renders env vars into the OLD template.
    # See the private docs → "Prod nginx template
    # changes".
    environment:
      SERVER_NAME: ${SERVER_NAME}
      FB_SERVER_NAME: ${FB_SERVER_NAME}
      ES_HOST: ${ES_HOST:-es01}
    depends_on:
      kib01:
        condition: service_healthy
      imports_container:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_DIR}/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ${NGINX_DIR}/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Docs (built by step7-build-docs.sh) and marketing site (rsync'd from
      # the private the private docs submodule). step3 ensures both DOCS_DIR
      # and MARKETING_DIR exist as host directories, even if empty — that way
      # the bind mounts always succeed and nginx serves 404 from empty dirs
      # for routes whose content hasn't been deployed yet. Equivalent to the
      # pre-compose behavior where step6 skipped the mount when the dir was
      # missing, but without compose's bind-mount-fails-on-missing-dir trap.
      - ${DOCS_DIR}:/var/www/deam-docs:ro
      - ${MARKETING_DIR}:/var/www/marketing:ro
    restart: unless-stopped
    healthcheck:
      # TCP probe on :80. An HTTP probe would hit the default-server block
      # which `return 444`s requests with an unmatched Host header, and the
      # only matching server_names are the public hostnames (which won't
      # resolve to localhost from inside the container). nc -z exits 0 if
      # the port is accepting connections, which is what "nginx is up"
      # means operationally — the routing logic above the port is verified
      # by the route-driven smoke tests in the deploy runbook, not here.
      # 127.0.0.1 not localhost: alpine's BusyBox nc resolves localhost
      # via getent which prefers ::1 (IPv6) first, but nginx is bound on
      # 0.0.0.0 only, not ::, so the IPv6 attempt fails and nc exits 1
      # before falling back to IPv4. Explicit 127.0.0.1 avoids the resolve.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      elastic-network:
        ipv4_address: 172.18.0.5

# =============================================================================
# Networks
# =============================================================================
# elastic-network is created by step3-app-stack.sh as `external: true` so the
# subnet (172.18.0.0/16) and gateway (172.18.0.1) survive `compose down`.
# Compose-created networks would be torn down with the stack, which would
# rotate IPs and break the fixed-IP assumptions in master-config.yaml.
networks:
  elastic-network:
    external: true
