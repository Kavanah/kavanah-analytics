# deployment/logrotate-deam-app-logs.conf
# Installed to /etc/logrotate.d/deam-app-logs by 03_provision_cron_jobs.sh.
#
# Sibling of logrotate-deam-imports.conf, kept SEPARATE because the rotation
# semantics genuinely differ: those are cron logs under /var/log that nothing
# holds open, these are gunicorn logs that a long-lived process keeps open.
#
# WHY THIS IS REQUIRED, NOT OPTIONAL:
# Item 3 of that ticket moved the gunicorn logs out of the container's /tmp
# onto the host-mounted import-data volume so they survive a container
# recreate. /tmp being wiped on every rebuild was the ONLY thing capping their
# size. Persisting them without rotation trades a self-clearing file for an
# unbounded one — strictly worse. Nothing rotated this directory before:
# logrotate is not installed inside the container, and deam-imports covers
# /var/log/*.log only.
#
# copytruncate is LOAD-BEARING: gunicorn holds --access-logfile /
# --error-logfile open and does not reopen them on SIGHUP. A plain rename
# would leave gunicorn writing into an unlinked inode — the log silently stops
# growing while the process believes it is still logging.
#
# su root root: gunicorn runs as root in the container, so these land
# root-owned on the host (same reasoning as deam-imports).
#
# maxsize 100M is the runaway guard — daily rotation alone would let one bad
# day (an error loop at thousands of lines/sec) fill the disk before the next
# rotation window.
#
# Both clone paths are listed and missingok is set, so the same file is valid
# on staging (~/DE-Reporting) and prod (~/kavanah-analytics) without
# per-host variants to drift apart.

/home/ubuntu/kavanah-analytics/import-data/logs/asset_web_*.log
/home/ubuntu/kavanah-analytics/import-data/logs/fb_oauth_*.log
/home/ubuntu/kavanah-analytics/import-data/logs/pw_reset_*.log
/home/ubuntu/DE-Reporting/import-data/logs/asset_web_*.log
/home/ubuntu/DE-Reporting/import-data/logs/fb_oauth_*.log
/home/ubuntu/DE-Reporting/import-data/logs/pw_reset_*.log
{
    daily
    su root root
    rotate 14
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 root root
}

# the manual-import log. Every "Run import" click in DEAM appends to
# this one undated file (IMPORT_LOG_FILE, import_service.MANUAL_LOG_FILE), so it
# grew without bound. copytruncate because a running manual import holds it
# open. ~30 days kept, matching the dated imports_YYYYMMDD.log files, which are
# NOT listed here: each is written under its own date and never again, so
# logrotate cannot age them out; lib/logging.py prunes those past 30 days.
/home/ubuntu/kavanah-analytics/import-data/logs/imports_manual.log
/home/ubuntu/DE-Reporting/import-data/logs/imports_manual.log
{
    daily
    su root root
    rotate 30
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
