# /etc/logrotate.d/deam-imports
# Installed by deployment/03_provision_cron_jobs.sh.
#
# Rotates DEAM import logs daily, keeps 14 days, compresses old rotations,
# and tolerates missing files (uninstalling the cron block leaves these
# orphaned but harmless).
#
# Note: imports run as root via cron + docker exec, so the underlying log
# files end up root-owned in practice. `create 0664 root root` matches that
# exactly. If a non-root user starts owning the logs, update the create line.
#
# `su root root` is required because /var/log on Ubuntu is root:syslog mode 775
# (group-writable by syslog). Modern logrotate refuses to rotate in such
# directories without an explicit su directive — without it, debug-mode reports
# "skipping ... because parent directory has insecure permissions" for every
# log. Discovered during prod cutover 2026-05-09.

# this list MUST cover every log the cron _SCHEDULE in
# 03_provision_cron_jobs.sh writes to (/var/log/<log_slug>.log). The symmetry is
# pinned by the release-plan tests so
# a cron added without a matching rotation entry fails CI.
#
# The seven per-connector import logs (echo/facebook/google_ads/youtube/
# google_analytics/chatwoot/dt_import) were removed here when their cron rows
# were dropped from 03_provision_cron_jobs.sh (the run_daily_imports cutover);
# leaving the rotation entries behind tripped the no-stale-entry half of the
# symmetry guard. Imports now run via the report scheduler.
/var/log/refresh_connection_tokens.log
/var/log/kavanah_demo_data.log
/var/log/kavanah_demo_dt_reseed.log
/var/log/trial_ending_email.log
/var/log/tiktok_daily_snapshot.log
/var/log/report_scheduler.log
/var/log/deferred_build_sweep.log
/var/log/credential_health_probe.log
/var/log/retention_sweep.log
/var/log/retention_dt_reconcile.log
/var/log/team_data_purge.log
/var/log/youtube_duplicate_check.log
{
    daily
    su root root
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0664 root root
}
